version: "3.9"

services:
  trader:
    build: .
    container_name: privateeyetrader
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./privateye/config/settings.yaml:/app/privateye/config/settings.yaml:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "privateye.main", "--mode", "paper"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
