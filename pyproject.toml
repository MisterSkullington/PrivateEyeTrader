[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privateye-trader"
version = "1.0.0"
description = "AI-powered crypto trading system for personal use"
requires-python = ">=3.11"
dependencies = [
    # Exchange connectivity
    "ccxt>=4.3",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta>=0.3.14b",
    # Data models
    "pydantic>=2.7",
    # Web dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "websockets>=12",
    "python-multipart>=0.0.9",
    # Storage
    "aiosqlite>=0.20",
    # Config
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Alerts
    "python-telegram-bot>=21",
    # Logging + CLI
    "loguru>=0.7",
    "rich>=13",
    # HTTP
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]
ml = [
    # Deep learning
    "torch>=2.2",
    # Gradient boosting + explainability
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    # Regime detection
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
    # Reinforcement learning
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
    # Persistence
    "joblib>=1.3",
]

[project.scripts]
privateye = "privateye.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["privateye*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
