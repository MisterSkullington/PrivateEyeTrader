mode: paper  # backtest | paper | live

symbols:
  - "BTC/USDT"
  - "ETH/USDT"
  - "SOL/USDT"
  - "BNB/USDT"
  - "AVAX/USDT"

timeframes:
  - "1m"
  - "5m"
  - "1h"
  - "4h"
  - "1d"

primary_timeframe: "1h"

exchanges:
  binance:
    enabled: true
    sandbox: false  # MAINNET data feed (paper mode still simulates fills locally via SimulatedExchange)
    exchange_id: "binance"
  bybit:
    enabled: false              # set true to enable as data fallback / price validation
    sandbox: true
    exchange_id: "bybit"

risk:
  max_risk_per_trade_pct: 0.01      # 1% of equity at risk per trade
  max_daily_drawdown_pct: 0.05      # 5% — circuit breaker halts all trading
  max_position_notional_pct: 0.20   # max 20% of equity notional per symbol
  atr_period: 14
  atr_stop_multiplier: 2.0
  max_bars_in_trade: 48
  min_confidence: 0.55              # signals below this confidence are ignored
  restricted_assets: []             # e.g. ["LUNA/USDT", "UST/USDT"] — skip entry signals

  sizing_method: "fixed_risk"       # fixed_risk | kelly | volatility_targeted
  portfolio_dd_halt_pct: 0.0       # NEW Phase 5: 0 = disabled; e.g. 0.08 = halt at 8% portfolio DD

  kelly:
    fraction: 0.5                   # half-Kelly multiplier

  volatility_targeted:
    target_vol_pct: 0.01            # 1% daily portfolio vol target

  advanced:
    asset_filter:
      enabled: false
      min_volume_usd_24h: 1000000   # 24h USD volume floor
      max_daily_vol_pct: 0.15       # daily HV ceiling (ann. HV / sqrt(365))
      banned_symbols: []            # e.g. ["LUNA/USDT", "SQUID/USDT"]

    exposure_monitor:
      enabled: false
      max_concentration_pct: 0.40   # single position <= 40% of equity
      max_total_notional_pct: 0.80  # total exposure <= 80% of equity
      max_portfolio_beta: 2.0       # portfolio BTC-beta ceiling
      correlation_lookback: 60
      btc_beta_symbols: {}          # e.g. {ETH/USDT: 0.85, SOL/USDT: 1.10}

    black_swan:
      enabled: false
      flash_crash_pct: -0.08        # single-bar return <= -8% triggers flatten
      volume_spike_multiplier: 5.0  # volume >= 5x rolling mean
      volume_lookback: 20
      max_funding_rate_abs: 0.003   # abs(funding_rate) >= 0.3% per 8h
      stablecoin_depeg_pct: 0.005   # 0.5% from $1.00
      stablecoin_symbols: []

strategies:
  directional:
    enabled: true
    timeframe: "1h"
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ema_trend: 200
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30

  mean_reversion:
    enabled: true
    timeframe: "1h"
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30

backtesting:
  fee_maker: 0.001      # 0.1% Binance maker fee
  fee_taker: 0.001      # 0.1% Binance taker fee
  slippage_pct: 0.0005  # 0.05% slippage estimate
  max_fill_pct_of_volume: 0.30  # partial fill cap: max 30% of bar volume
  initial_capital: 10000.0
  data_dir: "data/historical"

data:
  bar_window: 500       # bars retained in rolling DataSnapshot window
  sqlite_path: "data/privateye.db"
  poll_interval_seconds: 60  # live data polling interval

dashboard:
  host: "127.0.0.1"          # Phase 13 (C-4): loopback only by default; change to "0.0.0.0" intentionally for LAN/Docker access
  port: 8081
  ws_push_interval_seconds: 5
  require_auth: true         # Phase 13 (C-4): when true, env DASHBOARD_API_KEY must be set in live mode

alerts:
  min_level: "INFO"     # CRITICAL | INFO | DEBUG
  rate_limit_seconds: 60     # min interval between same event-type alerts
  history_size: 100          # in-memory alert record capacity
  # Credentials loaded from .env

alt_data:
  enabled: false                     # set true after running scripts/fetch_alt_data.py
  auto_fetch_live: false             # set true to enrich paper/live bars with live alt-data
  funding_rates:
    enabled: true
    symbol: "BTC/USDT"
  fear_greed:
    enabled: true
    cache_ttl_hours: 6               # re-fetch if older than 6h

execution:
  use_twap: false                    # enable TWAP slicing for large orders
  twap_slices: 4                     # number of equal time slices
  twap_threshold_usd: 1000           # only TWAP orders above this notional
  use_fee_optimizer: false           # enable FeeOptimizer in FusionStrategy
  fee_adjusted_min_return: 0.003     # 0.3% minimum expected return after costs
  limit_patience_bars: 3             # cancel unfilled limit orders after N bars
  limit_order_preference: false      # use LIMIT orders when optimizer allows

  # Phase 3 — Execution & Microstructure
  predictive_slippage:
    enabled: true
    alpha: 0.1
    avg_daily_volume_usd: 500000000  # 500M USD/day (BTC/USDT default)

  smart_routing:
    enabled: false                   # multi-venue routing (Bybit disabled by default)
    min_score_diff_bps: 0.5          # minimum cost diff (bps) to switch venues
    urgency_threshold: 0.85          # confidence above which MARKET order is chosen

  pre_trade_analysis:
    enabled: false                   # Gate 11: reject trades with net_edge < threshold
    min_net_edge_pct: 0.0025         # 0.25% minimum net edge after fees + slippage

  shadow_mode_2:
    reality_score_window: 50         # rolling fills window for Reality Score
    conservative_mode_threshold: 0.75  # Reality Score below this activates conservative mode
    conservative_size_multiplier: 0.5  # position sizes multiplied by this in conservative mode

ml:
  enabled: true                         # FusionStrategy active — uses GBM + LSTM + regime gates
  artifacts_dir: "privateye/models/artifacts"
  strategy: "fusion"                    # directional | mean_reversion | fusion

  lstm:
    lookback_bars: 60
    label_horizon_bars: 5
    label_threshold: 0.002              # 0.2% minimum return for positive label
    hidden_size: 256
    num_layers: 2
    dropout: 0.2
    epochs: 50
    patience: 10
    batch_size: 64
    lr: 0.0001

  gbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    gate_threshold: 0.30                # set below base rate (~0.37) until GBM is retrained with more data

  rl:
    total_timesteps: 500000
    n_steps: 2048
    batch_size: 64

  regime:
    n_states: 4

  fusion:
    sharpe_window_trades: 30            # trailing window for per-source Sharpe weighting
    regime_gate: true                   # suppress directional/MR based on regime
    gbm_gate: true                      # suppress low-probability signals via GBM
    gbm_gate_threshold: 0.30
    mtf_confirmation:
      enabled: false                    # set true to require 4h EMA agreement
      higher_timeframe: "4h"

  monte_carlo:
    enabled: false          # set true to run Monte Carlo after backtest
    n_simulations: 1000
    block_size: 20
    seed: 42                # RNG seed for reproducible results

  lgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 63
    gate_threshold: 0.45

  attention_lstm:
    lookback_bars: 60
    label_horizon_bars: 5
    label_threshold: 0.002
    hidden_size: 256
    num_layers: 2
    dropout: 0.2
    n_heads: 4
    epochs: 50
    patience: 10
    batch_size: 64
    lr: 0.0001

  neural_regime:
    n_states: 4
    hidden: 64
    epochs: 50
    lr: 0.001
    batch_size: 256

  stacking:
    n_folds: 5
    label_horizon: 5
    label_threshold: 0.002
    meta_n_estimators: 100
    enabled: false            # set true after all base models are trained

walk_forward:
  train_bars: 6048      # ~252 trading days at 1h (adjust per timeframe)
  test_bars: 1512       # ~63 trading days at 1h
  step_bars: 1512       # advance by one test window each fold
  min_train_bars: 500   # skip fold if IS window shorter than this
  min_test_trades: 5    # flag OOS folds with fewer trades (data quality warning)

optimization:
  strategy_name: "directional"         # strategy block to override: directional | mean_reversion
  metric: "sharpe_ratio"               # sharpe_ratio | total_pnl | calmar_ratio
  min_trades: 5                        # flag combinations with fewer OOS trades
  param_grid:
    directional:
      macd_fast: [8, 10, 12]
      macd_slow: [22, 26, 30]
      macd_signal: [7, 9]
    mean_reversion:
      bb_period: [15, 20, 25]
      bb_std: [1.5, 2.0, 2.5]
      rsi_period: [10, 14]

compliance:
  jurisdiction: ""              # ISO 3166-1 alpha-2 code: "US" | "CN" | "" (disabled)
  tax_reporting:
    enabled: false              # set true to auto-export tax CSV after backtest
    output_dir: "data/reports"
    method: "fifo"              # fifo (lifo planned)
    wash_sale_window_days: 30   # advisory wash-sale detection window
  sanctions:
    enabled: true               # always check known sanctioned symbols
    extra_banned: []            # user-defined additional banned symbols

kfold:
  n_folds:         5     # number of cross-validation folds
  purge_bars:      100   # bars before test fold excluded from training
  embargo_bars:    10    # bars after  test fold excluded from training
  min_train_bars:  500   # skip fold if training set is too small
  min_test_trades: 5     # flag folds with too few test trades
  metric:          "sharpe_ratio"  # sharpe_ratio | total_pnl | calmar_ratio

phase0:
  golden_seed: 42
  golden_date_from: "2023-01-01"
  golden_date_to:   "2026-01-01"
  golden_output:    "artifacts/golden_results_v1.0.json"
  mlflow:
    enabled: false
    tracking_uri: "sqlite:///mlflow.db"
    experiment_name: "privateye-baseline"
  optuna:
    enabled: false
    n_trials: 100

phase1:
  complete: false
  features:
    derivatives_enabled: true
    macro_enabled: true
    enhanced_sentiment_enabled: true
    use_extended_in_models: false   # set true after retraining models on 86-feature data
  macro_provider:
    cache_ttl_seconds: 60
    timeout_seconds: 10
  drift_detection:
    enabled: false                  # set true to gate online retraining on drift check
    p_threshold: 0.01
    drift_threshold: 0.20
    min_reference_rows: 200
    reference_window_bars: 500      # bars fed to drift_detector.fit() on init

robustness:
  online_learning:
    enabled: true                # incremental retrain every retrain_every_bars new MARKET_DATA bars
    buffer_bars: 2000            # rolling bar buffer per symbol/timeframe
    retrain_every_bars: 200      # new bars between retrain triggers
    models: [gbm, lstm, regime]  # rl excluded by default (slow to retrain)
    validation_gate: true        # new model must not regress val_loss > 10%
    max_val_loss_regression: 0.10
    # Phase 4 additions
    ewc:
      enabled: false
      lambda: 400.0
    auto_retrain_on_drift: false
    live_performance_gate:
      enabled: false
      eval_window: 100
      min_trades: 50
      degradation_threshold: 0.15
    # Audit log config passed through to ModelUpdateAuditLog
    audit_log:
      enabled: true
      path: "data/model_audit.jsonl"

  self_healing:
    auto_recovery_seconds: 1800  # 30 min before auto-reset probe
    health_publish_interval_seconds: 60

  shadow_trading:
    enabled: false
    divergence_alert_threshold_pct: 2.0
    reality_score_window: 50         # Phase 3: see execution.shadow_mode_2 for override
    conservative_mode_threshold: 0.75

  # Phase 4: model update audit log (top-level shorthand consumed by main.py)
  audit_log:
    enabled: true
    path: "data/model_audit.jsonl"

phase3:
  complete: false

phase4:
  complete: false

portfolio_backtest:
  optimizer: "equal_weight"         # equal_weight | risk_parity
  min_bars_for_optimizer: 30        # fall back to equal weight if fewer bars available
  use_correlation: false            # risk_parity: use correlation matrix adjustment

phase5:
  complete: false
